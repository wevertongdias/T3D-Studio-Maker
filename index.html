<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071426">
  <meta name="description" content="Gestão de produção, estoque e vendas — T3D Studio Maker.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-512.png">
  <title>T3D Studio Maker</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#071426;color:#fff;font-family:Arial,sans-serif}
    body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
    main{width:min(100%,420px);text-align:center;padding:30px 22px;border:1px solid #1d3553;border-radius:24px;background:linear-gradient(160deg,#10233d,#09172a);box-shadow:0 18px 55px #0006}
    img{width:min(68vw,230px);height:auto;object-fit:contain;margin-bottom:16px}
    h1{font-size:24px;margin:0 0 10px;letter-spacing:.3px}p{color:#b8c8dc;font-size:14px;line-height:1.55;margin:0 0 24px}
    a{display:block;padding:16px 20px;border-radius:14px;background:#087fbd;color:#fff;text-decoration:none;font-weight:700;font-size:16px}
    small{display:block;color:#8fa5bf;font-size:11px;line-height:1.5;margin-top:18px}
  </style>
</head>
<body>
  <main>
    <img src="icons/icon-512.png" alt="Logo T3D Studio Maker">
    <h1>T3D Studio Maker</h1>
    <p>Seu sistema de gestão de produção, estoque, vendas e financeiro.</p>
    <a id="openApp" href="https://script.google.com/macros/s/AKfycbyYGOSuBkQVEcUxp8rWMrdYOBrGqS4Ld83kbQKS3w8I9tidapgvw6ukcpLCKwUD3-d0/exec">Abrir meu sistema</a>
    <small>É necessário estar conectado à internet. Seus dados continuam na planilha Google vinculada ao sistema.</small>
  </main>
  <script src="config.js"></script>
  <script>
    const url=(window.T3D_CONFIG&&window.T3D_CONFIG.appsScriptUrl)||'';
    const link=document.getElementById('openApp');
    if(url && /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/.test(url)) link.href=url;
    if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error));}
  </script>
</body>
</html>
