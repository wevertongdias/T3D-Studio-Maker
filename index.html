<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071426">
  <meta name="description" content="Gestão de produção, estoque e vendas — T3D Studio Maker.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-512.png">
  <title>T3D Studio Maker</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#071426;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
    #app{width:100%;height:100%;height:100dvh;border:0;display:block;background:#071426}
    #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#071426;z-index:2;text-align:center;padding:24px}
    #loading img{width:min(78vw,330px);height:auto}#loading p{color:#b8c8dc;font-size:14px;line-height:1.5;max-width:330px}
    #error{display:none;color:#ffd0d0;font-size:13px;max-width:340px;overflow-wrap:anywhere}
  </style>
</head>
<body>
  <div id="loading"><img src="icons/icon-512.png" alt="T3D Studio Maker"><p>Conectando ao sistema…<br>É necessário estar conectado à internet.</p><div id="error"></div></div>
  <iframe id="app" title="T3D Studio Maker" allow="clipboard-read; clipboard-write; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <script src="config.js"></script>
  <script>
    const frame=document.getElementById('app'),loading=document.getElementById('loading'),error=document.getElementById('error');
    const url=(window.T3D_CONFIG&&window.T3D_CONFIG.appsScriptUrl)||'';
    if(!url||!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/.test(url)){
      error.style.display='block';error.textContent='Falta configurar o endereço da implantação do Google Apps Script no arquivo config.js.';
    }else{
      frame.src=url;
      frame.addEventListener('load',()=>{loading.style.display='none';});
      setTimeout(()=>{if(loading.style.display!=='none'){error.style.display='block';error.textContent='O sistema ainda está carregando. Confira a conexão e se a implantação do Apps Script está acessível.';}},18000);
    }
    if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error));}
  </script>
</body>
</html>
